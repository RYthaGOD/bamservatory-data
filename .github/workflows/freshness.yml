# Separate status: a fresh publication must never clear an archive failure.
name: freshness

on:
  schedule:
    # Best effort; GitHub does not guarantee punctual execution.
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/freshness.yml"
      - "check-freshness.mjs"
      - "test/freshness.mjs"
      - "ci-alert.mjs"
      - "test/ci-alert.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: published data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node test/freshness.mjs
      - run: node test/ci-alert.mjs
      - run: node check-freshness.mjs

  # Carries a red result to a person: one issue per incident, mentioning the
  # owner, closed by the next green run. Why it exists is in ci-alert.mjs.
  alert:
    name: alert on red
    needs: [freshness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node ci-alert.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
