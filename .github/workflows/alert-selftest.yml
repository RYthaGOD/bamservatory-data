# Proves the red-CI alert still reaches a person, end to end, with the same
# token and permissions the real workflows use. Run it by hand after changing
# ci-alert.mjs or the repository's settings: it opens a "CI red: alert
# self-test" issue that mentions the owner, checks it exists, then closes it as
# a green run would. Expect one notification.
name: alert self-test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  selftest:
    name: alert reaches the owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-alert-alert-self-test
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW: alert self-test
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT: ${{ github.event_name }}
      OWNER: ${{ github.repository_owner }}
      LIST: repos/${{ github.repository }}/issues?state=open&labels=ci-red&per_page=100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: a red run opens one issue
        run: node ci-alert.mjs
        env:
          NEEDS: '{"selftest":{"result":"failure"}}'
      # Read back through the same REST listing ci-alert.mjs uses, and retried
      # briefly: a check run a second after creation once missed the issue.
      - name: which is open, labelled, and mentions the owner
        run: |
          for i in 1 2 3 4 5 6; do
            gh api "$LIST" --jq '.[] | select(.title == "CI red: alert self-test") | .body' \
              | grep -q "^@$OWNER" && exit 0
            sleep 5
          done
          exit 1
      - name: a green run closes it
        run: node ci-alert.mjs
        env:
          NEEDS: '{"selftest":{"result":"success"}}'
      - name: and nothing is left open
        run: |
          for i in 1 2 3 4 5 6; do
            test -z "$(gh api "$LIST" --jq '.[] | select(.title == "CI red: alert self-test") | .title')" && exit 0
            sleep 5
          done
          exit 1
