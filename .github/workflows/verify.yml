# Continuous proof, run by GitHub rather than by the operator.
#
# Everything this repo claims — that the archive is intact, that the three
# vantages agree, that the published dashboard is actually fresh — has so far
# been checkable only by someone who chose to clone the repo and run a script.
# That is a weaker claim than it looks: the checks live on the same machines as
# the thing being checked, and nobody is obliged to run them.
#
# Running them here puts the verification somewhere the operator does not
# control the outcome, on a schedule, with a public pass/fail history. A red run
# is visible to anyone, including people who never asked for it.

name: verify

on:
  schedule:
    # Every six hours. The archive only gains a file once per UTC day, so more
    # frequent runs would mostly re-prove the same bytes; the staleness check
    # below is what benefits from running often, and six hours is well inside
    # the window in which a dead collector matters.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

# A job that hangs is worse than a job that fails.
#
# On 2026-08-18 the archive-integrity job stopped for three hours and twenty-three
# minutes inside `apt-get install zstd` — the runner could not reach a mirror —
# and was killed without ever running verify.sh. It left the run sitting
# in_progress long enough that five later runs piled up behind it looking equally
# stuck, and they had to be cancelled by hand to make the history readable again.
# Nothing was wrong with the archive, which is the point: the check never got far
# enough to have an opinion about it.
#
# These jobs finish in well under a minute. A cap an order of magnitude above that
# turns an infrastructure hang into a prompt, honest failure that the next
# scheduled run clears on its own.
  archive-integrity:
    name: archive integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # verify.sh needs the real zstd binary, not Node's implementation, so that
      # the check does not depend on the same runtime that wrote the files.
      - name: install zstd
        # Only reach for apt if the runner does not already have it. The hosted
        # image has shipped both for years, so this is normally a no-op — and on
        # 2026-08-18 the apt path hung for three hours and twenty-three minutes
        # against an unreachable mirror, taking the job with it. Skipping the
        # network entirely when nothing is needed removes the failure rather than
        # bounding it. The retry is for the case where something genuinely is.
        run: |
          if command -v zstd >/dev/null 2>&1; then
            echo "zstd already present: $(zstd --version | head -n1)"
            exit 0
          fi
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq zstd && exit 0
            echo "attempt $i failed; retrying"; sleep 5
          done
          echo "could not install zstd" >&2; exit 1

      - name: verify every archived day
        run: |
          chmod +x ./verify.sh
          ./verify.sh

  pipeline-guards:
    name: pipeline guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # gawk, not the mawk ubuntu ships as `awk`: flatten.awk uses
      # three-argument match(), which mawk ignores silently.
      - name: install gawk
        # Only reach for apt if the runner does not already have it. The hosted
        # image has shipped both for years, so this is normally a no-op — and on
        # 2026-08-18 the apt path hung for three hours and twenty-three minutes
        # against an unreachable mirror, taking the job with it. Skipping the
        # network entirely when nothing is needed removes the failure rather than
        # bounding it. The retry is for the case where something genuinely is.
        run: |
          if command -v gawk >/dev/null 2>&1; then
            echo "gawk already present: $(gawk --version | head -n1)"
            exit 0
          fi
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq gawk && exit 0
            echo "attempt $i failed; retrying"; sleep 5
          done
          echo "could not install gawk" >&2; exit 1

      # The guard that decides whether a capture enters the published series.
      # Wrong in one direction it publishes a network that never existed; wrong
      # in the other it stops the series tracking BAM. Both directions are
      # asserted here, against the real captures from the incident that prompted
      # the guard and against a synthetic drop designed to break it.
      - name: flatten partial-response guard
        run: bash ./test/flatten-guard.sh

  cross-vantage:
    name: cross-vantage agreement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # zstd support in node:zlib landed in 23.8. compare.mjs relies on it.
          node-version: "24"

      - name: compare vantages
        run: node compare.mjs --all

      # What the comparison forgives, asserted before it is trusted.
      #
      # compare.mjs excuses a node-set difference when it is shaped like one of
      # BAM fleet relabellings. That is a loosening of the only check that can
      # tell a faithful recording from a corroborated one, so it is held to both
      # directions: the real 2026-08-18 relabelling must be forgiven, and the
      # real 2026-08-12 torn read must not be. The synthetic pass isolates each
      # condition, because the archive alone cannot - dropping the stake test
      # left the archive suite green.
      - name: what the comparison forgives, against the archive
        run: node test/compare-relabel.mjs

      - name: and each condition of it, isolated
        run: node test/compare-relabel-synthetic.mjs

  freshness:
    name: published data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check the live endpoint has not gone stale
        run: |
          # A dead collector is invisible from the outside: the last good
          # metrics.json keeps being served indefinitely, so the dashboard looks
          # fine while the numbers quietly age. This is the dead-man's switch —
          # if capture stops, this job goes red.
          #
          # Publishing runs on a ~15 minute throttle. 90 minutes tolerates a
          # redeploy, a transient GitHub outage and a missed cycle without
          # crying wolf, while still catching a genuine stall within the hour.
          MAX_AGE_MIN=90
          URL=https://rythagod.github.io/bamservatory/metrics.json

          curl -fsSL "$URL" -o metrics.json
          GENERATED=$(node -e "console.log(require('./metrics.json').generatedAt)")
          AGE=$(node -e "console.log(Math.round((Date.now()-new Date('$GENERATED'))/60000))")

          echo "generatedAt : $GENERATED"
          echo "age         : ${AGE} min (limit ${MAX_AGE_MIN})"

          # Also assert the provenance a consumer is told to rely on is present.
          node -e "
            const m = require('./metrics.json');
            const fail = (s) => { console.error('MISSING: ' + s); process.exitCode = 1; };
            // Presence and plausibility, not a pinned value — this job exists to
            // catch a stalled or malformed publish, and should not go red merely
            // because the contract was legitimately versioned.
            if (!Number.isInteger(m.schemaVersion) || m.schemaVersion < 1) fail('schemaVersion');
            if (!m.provenance?.collector) fail('provenance.collector');
            if (!m.provenance?.archive) fail('provenance.archive');
            for (const k of ['summary.csv','nodes.csv','detections.log'])
              if (!String(m.provenance?.inputs?.[k] ?? '').startsWith('sha256:')) fail('digest for ' + k);
            if (!process.exitCode) console.log('provenance block intact');
          "

          if [ "$AGE" -gt "$MAX_AGE_MIN" ]; then
            echo "::error::published data is ${AGE} min old (limit ${MAX_AGE_MIN}). Capture or publishing has stalled."
            exit 1
          fi
